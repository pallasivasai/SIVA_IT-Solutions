name: 24x7 Product Discovery Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: product-discovery-autopilot
  cancel-in-progress: false

jobs:
  discover-research-build-sell:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Research market gaps and create product PR
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          AUTOPILOT_MARKET_NICHE: ${{ vars.AUTOPILOT_MARKET_NICHE || 'small business operations, local services and digital workflows in India' }}
        run: python autopilot.py

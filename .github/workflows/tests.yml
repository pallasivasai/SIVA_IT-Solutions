name: Python checks

on:
  push:
    branches: [main, "feat/**", "ai-proposal/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application and workers
        run: python -m compileall -q app.py agents.py ai_providers.py code_builder.py github_service.py market_research.py project_checks.py storage.py autopilot.py orchestration.py
      - name: Run unit tests
        run: pytest -q
